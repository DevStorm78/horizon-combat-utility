name: T-Bot native CI

on:
  push:
    branches: [native-hnmod]
    paths:
      - "native/tbot/**"
      - "README.md"
      - ".github/workflows/native-tbot.yml"
  pull_request:
    branches: [native-hnmod]
    paths:
      - "native/tbot/**"
      - "README.md"
      - ".github/workflows/native-tbot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbot-native-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST: "1.99.1"
  HORIZON_MODS_REV: "e5d840dabf3f8d21d6f15b793cd1fb83ed79db17"

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out T-Bot
        uses: actions/checkout@v4

      - name: Install the launcher's Rust toolchain
        run: |
          rustup toolchain install "$RUST" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Run Clippy with warnings denied
        working-directory: native/tbot
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run settings and parser tests
        working-directory: native/tbot
        run: cargo test --locked

      - name: Prepare the official Horizon native build workspace
        run: |
          git clone https://github.com/horizon-rust/horizon-mods.git "$RUNNER_TEMP/horizon-mods"
          git -C "$RUNNER_TEMP/horizon-mods" checkout "$HORIZON_MODS_REV"
          mkdir -p "$RUNNER_TEMP/horizon-mods/native"
          cp -R native/tbot "$RUNNER_TEMP/horizon-mods/native/tbot"

      - name: Check T-Bot applied to Horizon
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/horizon-mods/native/tools/native.py" check tbot

      - name: Adapt the pinned build helper to Horizon's split binary packages
        run: |
          python3 - "$RUNNER_TEMP/horizon-mods/native/tools/native.py" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()
          start = source.find("def cargo(stage_dir, action):")
          end = source.find("\n\ndef package(m):", start)
          if start < 0 or end < 0:
              raise SystemExit("Unexpected native.py layout; refusing an unverified patch")
          replacement = '''def cargo(stage_dir, action):
              jobs = os.environ.get("FLEET_LOAD_JOBS") or os.environ.get("CARGO_BUILD_JOBS")
              env = dict(os.environ, CARGO_TARGET_DIR=str(TARGET / "cargo"), RUSTFLAGS="-D warnings")

              # Horizon 26.3 keeps the client executable and horizon-ctl in
              # separate Cargo packages. Build both into the same target dir.
              command = ["cargo", action, "--locked", "-p", "horizon-client", "--bin", "horizon-client"]
              if action == "build":
                  command += ["--profile", "fast"]
              if os.environ.get("NATIVE_NO_DEFAULT_FEATURES"):
                  command.append("--no-default-features")
              if jobs:
                  command += ["-j", jobs]
              subprocess.run(command, cwd=stage_dir, env=env, check=True)

              if action == "build":
                  ctl = ["cargo", "build", "--locked", "-p", "horizon-client-lib", "--bin", "horizon-ctl", "--profile", "fast"]
                  if os.environ.get("NATIVE_NO_DEFAULT_FEATURES"):
                      ctl.append("--no-default-features")
                  if jobs:
                      ctl += ["-j", jobs]
                  subprocess.run(ctl, cwd=stage_dir, env=env, check=True)

              return TARGET / "cargo" / "fast"
          '''
          path.write_text(source[:start] + replacement + source[end:])
          compile(path.read_text(), str(path), "exec")
          print("Patched native.py build() to build the two binaries from their owning packages.")
          PY

      - name: Adapt pinned build script to current Horizon binary packages
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "horizon-mods/native/tools/native.py"
          source = path.read_text()
          old = '        command += ["--bin", "horizon-ctl", "--profile", "fast"]'
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one outdated horizon-ctl build command")
          source = source.replace(old, '        command += ["--profile", "fast"]', 1)

          anchor = '    subprocess.run(command, cwd=stage_dir, env=env, check=True)'
          if source.count(anchor) != 1:
              raise SystemExit("Could not locate native.py cargo build invocation")
          addition = "\n".join([
              "    if action == \"build\":",
              "        ctl_command = [",
              "            \"cargo\", \"build\", \"--locked\", \"-p\", \"horizon-client-lib\",",
              "            \"--bin\", \"horizon-ctl\", \"--profile\", \"fast\",",
              "        ]",
              "        if os.environ.get(\"NATIVE_NO_DEFAULT_FEATURES\"):",
              "            ctl_command.append(\"--no-default-features\")",
              "        if jobs:",
              "            ctl_command += [\"-j\", jobs]",
              "        subprocess.run(ctl_command, cwd=stage_dir, env=env, check=True)",
          ])
          source = source.replace(anchor, anchor + "\n" + addition, 1)
          path.write_text(source)
          print("Patched CI copy: build horizon-client and horizon-ctl from their actual packages.")
          PY

      - name: Build the Horizon client with T-Bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/horizon-mods/native/tools/native.py" build tbot

      - name: Package the installable .hnmod
        run: python3 "$RUNNER_TEMP/horizon-mods/native/tools/native.py" package tbot

      - name: Validate package contents
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import zipfile

          root = os.environ["RUNNER_TEMP"]
          path, = glob.glob(f"{root}/horizon-mods/native/target/tbot-*.hnmod")
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              manifest = json.loads(archive.read("horizon-native.json"))
          assert manifest["id"] == "tbot", manifest
          assert manifest["game"] == "26.3", manifest
          assert manifest["hooks"] == 359, manifest
          assert "mixins/tbot/horizon-mixin.toml" in names, names
          assert "mixins/tbot/runtime.rs" in names, names
          print(json.dumps({"artifact": path, "manifest": manifest, "files": names}, indent=2))
          PY

      - name: Upload installable bundle
        uses: actions/upload-artifact@v4
        with:
          name: tbot-0.2.0-hnmod
          path: ${{ runner.temp }}/horizon-mods/native/target/tbot-0.2.0.hnmod
          if-no-files-found: error
          retention-days: 30
